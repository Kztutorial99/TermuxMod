name: Build APK + SHA-1 Keystore

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Pulihkan keystore TermuxMod dari GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diisi di Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/termuxmod.keystore
          echo "Keystore dipulihkan ($(stat -c%s app/termuxmod.keystore) byte)"

      - name: Tampilkan SHA-1 & SHA-256 keystore TermuxMod
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore app/termuxmod.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" > /tmp/keystore.txt

          SHA1=$(grep -m1 "SHA1:" /tmp/keystore.txt | sed 's/.*SHA1: //' | tr -d ' \r')
          SHA256=$(grep -m1 "SHA256:" /tmp/keystore.txt | sed 's/.*SHA256: //' | tr -d ' \r')

          echo "=================================================="
          echo " SHA-1   : $SHA1"
          echo " SHA-256 : $SHA256"
          echo "=================================================="

          {
            echo "## Sidik Jari Keystore TermuxMod (tetap, tidak berubah)"
            echo ""
            echo "Salin ke Firebase Console > Project Settings > app \`com.termux\` > Add fingerprint."
            echo ""
            echo "**SHA-1**"
            echo '```'
            echo "$SHA1"
            echo '```'
            echo "**SHA-256**"
            echo '```'
            echo "$SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Beri izin eksekusi gradlew
        run: chmod +x ./gradlew

      - name: Build APK debug (ditandatangani keystore TermuxMod)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Verifikasi tanda tangan APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK: $APK"
          keytool -printcert -jarfile "$APK" | grep -E "SHA1:|SHA256:|Owner:" || true

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: termuxmod-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Hapus keystore dari runner
        if: always()
        run: rm -f app/termuxmod.keystore
