name: Build TermuxMod APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "Pilih arsitektur APK"
        type: choice
        required: true
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a
          - universal
          - x86_64
          - x86
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pulihkan keystore TermuxMod
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diisi di Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/termuxmod.keystore
          echo "Keystore dipulihkan ($(stat -c%s app/termuxmod.keystore) byte)"

      - name: Tampilkan SHA-1 & SHA-256 keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore app/termuxmod.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" > /tmp/keystore.txt
          SHA1=$(grep -m1 "SHA1:" /tmp/keystore.txt | sed 's/.*SHA1: //' | tr -d ' \r')
          SHA256=$(grep -m1 "SHA256:" /tmp/keystore.txt | sed 's/.*SHA256: //' | tr -d ' \r')
          {
            echo "## Sidik jari keystore TermuxMod"
            echo ""
            echo "Daftarkan di Firebase Console > Project Settings > app \`com.termux\`."
            echo ""
            echo "**SHA-1**"
            echo '```'
            echo "$SHA1"
            echo '```'
            echo "**SHA-256**"
            echo '```'
            echo "$SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cek google-services.json punya OAuth client Android
        run: |
          if grep -q '"client_type": 1' app/google-services.json; then
            echo "OK: OAuth client Android (client_type 1) tersedia."
          else
            echo "::error::google-services.json tidak punya OAuth client Android, Google Sign-In akan gagal code 10."
            exit 1
          fi

      - name: Build APK debug
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Siapkan APK sesuai pilihan arsitektur
        run: |
          ABI="${{ inputs.abi }}"
          SRC="app/build/outputs/apk/debug"
          mkdir -p out
          if [ "$ABI" = "all" ]; then
            cp "$SRC"/*.apk out/
          else
            found=0
            for f in "$SRC"/*"$ABI".apk; do
              [ -f "$f" ] || continue
              cp "$f" out/
              found=1
            done
            if [ "$found" = "0" ]; then
              echo "APK untuk $ABI tidak ditemukan. Isi folder:"
              ls -1 "$SRC"
              exit 1
            fi
          fi
          (cd out && sha256sum *.apk > sha256sums)
          ls -1 out
          {
            echo ""
            echo "## APK ($ABI)"
            echo '```'
            cat out/sha256sums
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: termuxmod-debug-${{ inputs.abi }}
          path: out/*
          if-no-files-found: error

      - name: Hapus keystore dari runner
        if: always()
        run: rm -f app/termuxmod.keystore
