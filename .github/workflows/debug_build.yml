name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          TERMUX_APP_VERSION_NAME: 0.118.0+${{ github.sha }}
          TERMUX_APK_VERSION_TAG: ${{ github.sha }}-github-debug

      - name: List generated APKs
        if: always()
        run: find app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: termuxmod-debug-apks-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
