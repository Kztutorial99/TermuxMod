buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.4'
        classpath 'com.google.gms:google-services:4.3.15'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

subprojects {
    configurations.all {
        // guava:listenablefuture and the empty listenablefuture:1.0 stub both
        // provide ListenableFuture, which breaks checkDuplicateClasses.
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
